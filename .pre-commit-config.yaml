repos:

- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: debug-statements

- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.15.8
  hooks:
  - id: ruff-check
    args: [ --fix ]
  - id: ruff-format

- repo: https://github.com/python-poetry/poetry
  rev: 2.3.2
  hooks:
  - id: poetry-check
  - id: poetry-lock
  - id: poetry-install
